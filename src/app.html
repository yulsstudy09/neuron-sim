<title>CA1 뉴런 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 현미경 관찰 화면 — 왼쪽 시료 목록 · 가운데 3D 관찰창과 그 아래 막전위 기록계 · 오른쪽 측정/편집 패널. 단일 다크 테마(형광 현미경 화면을 의도). */
:root {
  color-scheme: dark;
  --bg: #0a0f14; --panel: #111921; --panel-2: #16212b; --line: #233140;
  --fg: #dfe7ee; --muted: #8396a8; --accent: #ff4fa3;
  --ok: #4fd1a5; --warn: #ffb547; --bad: #ff6b7d;
  --soma: #f2b84b; --axon: #9aa5b1; --basal: #57c7e3; --apical: #a98cf0;
  --gm: #ff7a6b; --gh: #6aa8ff; --gn: #5fd38d;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled, input:disabled, select:disabled { opacity: .45; cursor: not-allowed; }

.app { height: 100%; display: grid; gap: 12px;
  grid-template-columns: minmax(0, 1fr) 350px; grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head" "main info"; }
header { grid-area: head; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pick { height: 36px; min-width: 240px; flex: 0 1 340px; max-width: 380px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font-family: var(--mono); font-size: 12.5px; }
.search { width: 170px; }
.modes { margin-left: auto; display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.modes button { height: 34px; padding: 0 18px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; }
.modes button.on { background: var(--accent); color: #1a0710; font-weight: 600; }
.head-state { font-size: 12px; color: var(--muted); }
header h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
header .sub { color: var(--muted); font-size: 13px; }
.stages { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.stage { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.stage.done { border-color: color-mix(in srgb, var(--ok) 50%, transparent); color: var(--ok); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-height: 0; min-width: 0; }
.list { grid-area: list; display: flex; flex-direction: column; overflow: hidden; }
.list .top { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.inp { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.upload { display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); border-radius: 8px; padding: 8px; color: var(--muted); cursor: pointer; font-size: 13px; }
.upload:hover, .upload.drag { border-color: var(--accent); color: var(--fg); }
.upload input { display: none; }
.items { overflow-y: auto; padding: 4px 0 8px; }
.gh { position: sticky; top: 0; background: var(--panel); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); padding: 10px 12px 4px; display: flex; justify-content: space-between; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 12px; cursor: pointer; border-left: 2px solid transparent; }
.item:hover { background: var(--panel-2); }
.item.on { background: var(--panel-2); border-left-color: var(--accent); }
.item .nm { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .ct { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.main { grid-area: main; display: grid; grid-template-rows: auto minmax(380px, 1fr) auto; gap: 12px; min-height: 0; min-width: 0; overflow-y: auto; }
.view { position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #0f1a24 0%, var(--bg) 75%); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.view.editing { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
.tip { position: absolute; pointer-events: none; font-family: var(--mono); font-size: 11px; background: rgba(10,15,20,.88); border: 1px solid var(--line); padding: 3px 7px; border-radius: 6px; transform: translate(12px, -50%); white-space: nowrap; }
.toolbar { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.seg { display: flex; background: rgba(17,25,33,.92); border: 1px solid var(--line); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
.seg button { background: none; border: 0; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.ctl { display: flex; align-items: center; gap: 8px; background: rgba(17,25,33,.92); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
.ctl input[type=range] { width: 80px; accent-color: var(--accent); }
.ctl output { font-family: var(--mono); color: var(--fg); min-width: 2.5em; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
.toolbar .btn { background: rgba(17,25,33,.92); }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #1a0710; font-weight: 600; }
.btn.danger { color: var(--bad); }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 3px; background: rgba(17,25,33,.9); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: calc(100% - 20px); }
.legend .row { display: flex; align-items: center; gap: 8px; }
.legend .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.legend .ramp { width: 140px; height: 8px; border-radius: 4px; }
.legend .n { font-family: var(--mono); color: var(--muted); margin-left: auto; padding-left: 10px; }
.hint { position: absolute; right: 10px; bottom: 10px; font-size: 11px; color: var(--muted); text-align: right; }

/* 막전위 기록계 */
.dock { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; }
.dock-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 12.5px; }
.dock-row label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.dock-row select, .dock-row input[type=number] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; color: var(--fg); }
.dock-row input[type=number] { width: 72px; font-family: var(--mono); }
.stimtag { font-family: var(--mono); color: var(--soma); }
.charts { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
.chart { position: relative; height: 170px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
.chart canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.chart .cap { position: absolute; left: 10px; right: 10px; top: 6px; white-space: nowrap; overflow: hidden; font-size: 11.5px; color: var(--muted); pointer-events: none; display: flex; gap: 10px; flex-wrap: wrap; }
.chart .cap i { font-style: normal; display: inline-flex; align-items: center; gap: 4px; }
.chart .cap i::before { content: ""; width: 12px; height: 2px; background: var(--c); }
.chart .cap i.dash::before { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }
.timebar { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.timebar input { flex: 1; accent-color: var(--accent); min-width: 0; }
.timebar output { font-family: var(--mono); min-width: 6.5em; text-align: right; }
.status { font-size: 12.5px; color: var(--muted); }
.status.warn { color: var(--warn); }
.status.bad { color: var(--bad); }
.metrics { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.metrics th, .metrics td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.metrics th:first-child, .metrics td:first-child { text-align: left; color: var(--muted); font-weight: 400; }
.metrics td { font-family: var(--mono); }
.metrics th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
.metrics .d-up { color: var(--ok); } .metrics .d-down { color: var(--bad); }
.scroll-x { overflow-x: auto; }

.info { grid-area: info; overflow-y: auto; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px 8px; cursor: pointer; color: var(--muted); font-size: 13px; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sec:last-child { border-bottom: 0; }
.sec h2 { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted); margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec h2 .id { font-family: var(--mono); color: var(--accent); letter-spacing: 0; font-size: 13px; }
.title { font-family: var(--mono); font-size: 13px; word-break: break-all; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
.chip.wt { color: var(--basal); } .chip.ad { color: var(--apical); } .chip.ed { color: var(--accent); }
dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; }
dt { color: var(--muted); font-size: 12.5px; }
dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
dd .u { color: var(--muted); margin-left: 3px; }
dd.hl { color: var(--warn); } dd.ed { color: var(--accent); }
.sub-h { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.badge { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--ok) 10%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.badge.none { background: var(--panel-2); border-color: var(--line); color: var(--muted); }
.badge b { color: var(--ok); font-weight: 600; }
.badge .d { color: var(--muted); font-family: var(--mono); font-size: 11px; display: block; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.fix { font-size: 12.5px; padding: 7px 10px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
.fix.bad { border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.fix.info { border-color: var(--line); background: var(--panel-2); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.err { color: var(--bad); font-size: 12.5px; margin: 0; }
.slider { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 4.2em; align-items: center; gap: 8px; font-size: 12.5px; }
.slider span { color: var(--muted); }
.slider input { width: 100%; accent-color: var(--accent); }
.slider output { font-family: var(--mono); text-align: right; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.rowf { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.rowf select, .rowf input { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; color: var(--fg); }
.rowf input[type=number] { width: 84px; font-family: var(--mono); }
.ok-line { font-size: 12px; color: var(--ok); margin: 0; }
.main > .status { min-height: 18px; padding: 0 2px; }
.dock-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; }
.dock.folded > :not(.dock-head) { display: none; }
.simctl { display: flex; flex-direction: column; gap: 0; }
.simctl > .btn.big { margin: 14px 16px 0; height: 48px; font-size: 15px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.opt { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; text-align: left; font-size: 13px; line-height: 1.3; display: flex; flex-direction: column; gap: 2px; color: var(--muted); }
.opt b { font-weight: 600; color: var(--fg); }
.opt small { font-size: 11.5px; color: var(--muted); }
.opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.opt:disabled { opacity: .4; cursor: not-allowed; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 3px 0; }
.kv > span:first-child { color: var(--muted); }
.kv > span:last-child { font-family: var(--mono); text-align: right; }
.adv { border-top: 1px solid var(--line); margin-top: 4px; }
.adv > summary { cursor: pointer; padding: 12px 16px; font-size: 13px; color: var(--muted); }
.adv > :not(summary) { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.simctl > .adv > :not(summary) { padding: 0 16px 14px; }
.app[data-mode="sim"] #info { display: none; }
.app:not([data-mode="sim"]) #simctl { display: none; }
.app:not([data-mode="sim"]) .dock { display: none; }
.app[data-mode="edit"] #mode { display: none; }

@media (max-width: 1100px) { .app { grid-template-columns: minmax(0, 1fr) 320px; } .charts { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 960px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "head" "main" "info"; }
  .main { grid-template-rows: auto auto auto; }
  .view { height: 58vh; min-height: 320px; }
  .modes { margin-left: 0; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>CA1 뉴런 시뮬레이터</h1>
    <select id="pick" class="pick" aria-label="뉴런 선택"></select>
    <input type="search" class="inp search" id="q" placeholder="검색 (예: WT0601)" aria-label="뉴런 검색">
    <label class="upload" id="drop" style="padding: 6px 10px" title="다른 SWC 파일을 불러옵니다"><input type="file" id="file" accept=".swc,.txt" multiple>SWC 불러오기</label>
    <nav class="modes" id="appmode" aria-label="모드">
      <button type="button" data-am="view" class="on">보기</button>
      <button type="button" data-am="edit">편집</button>
      <button type="button" data-am="sim">시뮬레이션</button>
    </nav>
    <span class="head-state" id="head-state"></span>
  </header>

  <div class="main">
    <div class="status" id="status" aria-live="polite">뉴런을 불러오는 중…</div>
    <section class="panel view" id="view" aria-label="3D 뉴런">
      <canvas id="gl"></canvas>
      <div class="toolbar">
        <div class="seg" id="mode" role="group" aria-label="색상 기준">
          <button data-m="volt">막전위</button>
          <button data-m="comp">연결 구조</button>
          <button data-m="radius">반지름</button>
          <button data-m="fix">보정 위치</button>
        </div>
        <label class="ctl" for="thick">굵기 표시 <input type="range" id="thick" min="1" max="8" step="0.5" value="3"><output id="thickv">×3</output></label>
        <label class="ctl" for="ghost"><input type="checkbox" id="ghost" checked> 원본 겹쳐 보기</label>
        <button class="btn" id="reset">시점 초기화</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="hint" id="hint"></div>
      <div class="tip" id="tip" hidden></div>
    </section>

    <section class="panel dock" id="dock" aria-label="막전위 기록계">
      <div class="dock-head"><span>막전위 기록계</span><button class="btn" id="fold" type="button">접기 ▴</button></div>
      <div class="charts">
        <div class="chart"><canvas id="cv"></canvas><div class="cap" id="capv"></div></div>
        <div class="chart"><canvas id="cg"></canvas><div class="cap" id="capg"></div></div>
      </div>
      <div class="timebar">
        <button class="btn" id="play" aria-label="재생">▶ 재생</button>
        <input type="range" id="time" min="0" max="0" value="0" aria-label="시간">
        <output id="timev">0.00 ms</output>
      </div>
      <div class="scroll-x"><table class="metrics" id="metrics"></table></div>
    </section>
  </div>

  <aside class="panel info" aria-label="정보와 편집">
    <div id="info" aria-live="polite"></div>
    <div class="simctl" id="simctl">
      <button class="btn pri big" id="run" type="button">시뮬레이션 실행</button>
      <section class="sec">
        <h2>자극 위치 <span class="id" id="stimtag">자동</span></h2>
        <div class="btns"><button class="btn" id="setstim" type="button">선택 노드를 자극 위치로</button><button class="btn" id="autostim" type="button">자동 (가장 먼 말단)</button></div>
      </section>
      <section class="sec">
        <h2>자극 세기</h2>
        <div class="opts">
          <button class="opt on" id="st-r" type="button"><b>R 방식</b><small>약함 · 기존 연구 방식</small></button>
          <button class="opt" id="st-f" type="button"><b>활동전위 보기</b><small>0.1 nA 고정 전류</small></button>
        </div>
      </section>
      <section class="sec">
        <h2>결과 <span class="id">원본 → 수정본</span></h2>
        <div id="res"><p class="empty">시뮬레이션을 실행하면 결과가 나옵니다</p></div>
      </section>
      <details class="adv">
        <summary>고급 설정 (Δt, 시간, 자극 값, 수렴성, RK4, CSV)</summary>
        <div class="rowf">자극 방식 <select id="stimmode"><option value="density">R 방식: 밀도 × 노드 면적</option><option value="fixed">고정 전류</option></select></div>
        <div class="rowf">자극 값 <input type="number" id="stimval" step="any" value="20"> <span id="stimunit">µA/cm²</span></div>
        <div class="rowf">Δt <select id="dt"><option>0.01</option><option>0.005</option><option>0.0025</option></select> ms · 시간 <input type="number" id="tend" value="20" min="1" max="200" step="1"> ms</div>
        <div class="rowf"><label><input type="checkbox" id="cmp" checked> 원본과 비교</label></div>
        <div class="btns"><button class="btn" id="conv" type="button">시간 간격 수렴성 검사</button><button class="btn" id="rk4" type="button">RK4와 비교</button><button class="btn" id="dlsim" type="button">결과 CSV 저장</button></div>
        <div class="status" id="extra"></div>
      </details>
    </div>
  </aside>
</div>

      if (!a) return `<tr><td>${lab}</td><td>${U(b[k], u, d)}</td></tr>`;
      const dv = b[k] - a[k], cls = !Number.isFinite(dv) || Math.abs(dv) < 1e-9 ? '' : (k === 'delay' ? (dv > 0 ? 'd-down' : 'd-up') : (dv > 0 ? 'd-up' : 'd-down'));
      return `<tr><td>${lab}</td><td>${U(a[k], u, d)}</td><td>${U(b[k], u, d)}</td><td class="${cls}">${Number.isFinite(dv) ? (dv > 0 ? '+' : '') + f(dv, d) : '—'}</td></tr>`;
    }).join('');
  }

  // ---------- 수렴성 · RK4 · 저장 ----------
  $('#conv').onclick = () => {
    const x = $('#extra'); x.textContent = '시간 간격 0.01 / 0.005 / 0.0025 ms로 계산 중…';
    setTimeout(() => {
      try {
        const out = [0.01, 0.005, 0.0025].map(dt => { const o = simOpts(N); o.DT_MS = dt; o.recordEvery = 1e9; const r = H.simulate(N, o); return { dt, sp: r.peak[r.stim], pp: r.peak[r.prox] }; });
        const ref = out[2];
        x.innerHTML = '수렴성 (기준 Δt=0.0025): ' + out.map(o => `Δt ${o.dt}: 자극 ${f(o.sp, 4)} mV, 근위 ${f(o.pp, 4)} mV` + (o === ref ? '' : ` (차이 ${f(Math.abs(o.pp - ref.pp) / Math.max(Math.abs(ref.pp), 1e-12) * 100, 3)}%)`)).join(' · ');
      } catch (e) { x.textContent = '수렴성 검사 실패: ' + e.message; }
    }, 30);
  };
  $('#rk4').onclick = () => {
    const x = $('#extra'); x.textContent = 'RK4로 같은 문제를 푸는 중…';
    setTimeout(() => {
      try {
        const dt = +$('#dt').value, o = simOpts(N); o.rk4MaxTime = Math.min(o.TOTAL_TIME_MS, 6);
        const r = H.simulateRK4(N, o), need = H.rk4StableDt(N, o), steps = Math.ceil(o.TOTAL_TIME_MS / need);
        x.innerHTML = (r.diverged ? `<b style="color:var(--bad)">RK4는 Δt=${dt} ms에서 t=${f(r.diverged.t, 3)} ms에 발산했습니다</b> (값이 폭발). ` : `RK4가 ${f(r.tEnd, 1)} ms까지 발산하지 않았습니다. `) +
          `이 뉴런에서 RK4가 안정하려면 Δt ≤ 약 ${need.toExponential(1)} ms가 필요합니다. 현재보다 약 ${Math.round(dt / need).toLocaleString()}배 작고, ${f(o.TOTAL_TIME_MS, 0)} ms를 계산하려면 약 ${steps.toLocaleString()}걸음입니다. 짧고 가는 구획이 만드는 빠른 전류(강직성) 때문이며, 그래서 R 코드는 막전위를 암시적(후진 오일러) 방법으로 풉니다.`;
      } catch (e) { x.textContent = 'RK4 비교 실패: ' + e.message; }
    }, 30);
  };
  $('#dlsim').onclick = () => {
    if (!sim) return;
    const rows = ['id,Peak_Depolarization_mV,Minimum_Voltage_Change_mV,Peak_Time_ms,Is_Stim,Is_Proximal'];
    for (let i = 0; i < sim.N; i++) rows.push([sim.ids[i], sim.peak[i], sim.minD[i], sim.peakT[i], i === sim.stim, i === sim.prox].join(','));
    const tr = ['Time_ms,Stim_V_mV,Proximal_V_mV'];
    for (let k = 0; k < sim.nRec; k++) tr.push([sim.T[k], sim.V[k * sim.N + sim.stim], sim.V[k * sim.N + sim.prox]].join(','));
    const head = `# ${meta.name}${editVersion ? ' (수정본)' : ''} · method=gate_exponential_Euler_voltage_backward_Euler_tree_solver · dt=${sim.dt} ms · stim #${sim.ids[sim.stim]} · proximal #${sim.ids[sim.prox]} · stim current ${sim.stimI} uA\n`;
    download(meta.name + (editVersion ? '_edited' : '') + '_simulation.csv', head + rows.join('\n') + '\n\n' + tr.join('\n') + '\n');
  };

  function showError(e, msg) {
    $('#info').innerHTML = `<section class="sec"><h2>불러오기 실패</h2><div class="title">${esc(e.name)}</div><p class="err">${esc(msg)}</p><p class="note">SWC 한 줄은 번호, 부위, x, y, z, 반지름, 부모 번호의 7개 값이어야 합니다.</p></section>`;
  }

  (function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
  resize();
  const last = entries.find(e => e.key === store.get('neuron'));
  const wt0601 = entries.filter(e => e.mouse === 'WT0601').sort((a, b) => b.nodes - a.nodes)[0];
  load(last || wt0601 || entries[0]);
  syncStim();
  setAppMode('view');
})();
</script>
